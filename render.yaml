# Infraestructura de Render como código.
#
# Un servicio creado a mano en el panel NO lee este archivo: hay que
# importarlo como Blueprint (New > Blueprint) o replicar estos valores en la
# configuración del servicio existente.
#
# Lo importante es el startCommand: aplica las migraciones antes de arrancar.
# Sin ese paso las tablas no existen, porque la aplicación ya no crea el
# esquema por su cuenta (ver docs/decisions/0003-alembic-migrations.md).

services:
  - type: web
    name: todo-api
    runtime: python
    plan: free
    region: oregon

    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Generada por Render la primera vez y conservada después.
      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString

      # Dominio del frontend. Sin esto, el navegador bloquea las peticiones
      # cruzadas. No hace falta si el frontend llama a la API a través del
      # rewrite de Vercel (misma origen), que es la configuración recomendada.
      - key: CORS_ORIGINS
        value: https://to-do-app-seven-wine-10.vercel.app

      - key: ENVIRONMENT
        value: production

databases:
  - name: todo-db
    plan: free
    databaseName: todo
    user: todo
