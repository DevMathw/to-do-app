# Levanta la API y PostgreSQL con un solo comando:
#   docker compose up --build
#
# La API queda en http://localhost:8000 y la documentación en /docs.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Clave de desarrollo. En producción se inyecta desde el proveedor.
      SECRET_KEY: clave-solo-para-desarrollo-local-no-usar-en-produccion
      DATABASE_URL: postgresql+psycopg://todo:todo@db:5432/todo
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENVIRONMENT: development
    depends_on:
      # Espera a que Postgres acepte conexiones: si no, las migraciones
      # fallarían en el primer arranque.
      db:
        condition: service_healthy

volumes:
  pgdata:
